<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitus - System Initialization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        .eva-input {
            transition: all 0.3s ease;
            border: 1px solid #cbd5e1;
        }
        .eva-input:focus {
            outline: none;
            border-color: #8a2be2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3), inset 0 0 5px rgba(0, 255, 204, 0.2);
            background-color: #faf5ff;
        }

        .sync-btn {
            background: linear-gradient(135deg, #8a2be2 0%, #135bec 100%);
            background-size: 200% 200%;
            transition: all 0.5s ease;
        }
        .sync-btn:hover {
            background-position: 100% 100%;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            transform: translateY(-2px);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .qr-scan-effect::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 10%;
            background: linear-gradient(to bottom, transparent, rgba(0, 255, 204, 0.8), transparent);
            animation: scanline 2s linear infinite;
            pointer-events: none;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 9999px;
            background: linear-gradient(to right, #8a2be2, #06b6d4);
            outline: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            border: 3px solid #8a2be2;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: border-color 0.2s, transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            border-color: #135bec;
            transform: scale(1.15);
        }
        input[type=range]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            border: 3px solid #8a2be2;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-slate-800">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-slate-100 mb-10 mt-4">

        <div class="h-2 w-full bg-gradient-to-r from-purple-600 via-teal-400 to-rose-500"></div>

        <div class="p-8">
            <div class="text-center mb-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mb-2">Protocol 08-X / Initialization</p>
                <h1 class="text-4xl font-black tracking-tighter text-slate-900">HABITUS <span class="text-purple-600">SYNC</span></h1>
                <p class="text-xs font-semibold text-slate-500 mt-2">あなたの「界」を入力し、ニューラルリンクを構築します。</p>
            </div>

            <div id="qr-wrapper" class="hidden mb-8 flex-col items-center">
                <div class="relative qr-scan-effect p-4 bg-white border-2 border-purple-500 rounded-2xl shadow-[0_0_15px_rgba(138,43,226,0.2)] overflow-hidden">
                    <div id="qrcode"></div>
                </div>
                <p class="text-xs text-slate-500 font-bold mt-4 text-center bg-slate-100 px-4 py-2 rounded-lg">相手の端末でこのコードをスキャン！</p>
                <div class="w-full h-px bg-slate-200 mt-8"></div>
            </div>

            <div class="space-y-6">

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1">Subject Name</label>
                    <input type="text" id="userName" placeholder="あなたの名前" class="eva-input w-full px-4 py-3 rounded-xl bg-slate-50 text-sm font-bold text-slate-900 placeholder-slate-400">
                </div>

                <!-- 問い：最上部に配置 -->
                <div class="bg-orange-50 rounded-2xl p-4 border border-orange-200">
                    <label class="block text-xs font-black text-orange-500 mb-1 leading-tight tracking-wide">
                        ❓ あなたの「問い」
                    </label>
                    <p class="text-[10px] text-orange-400 mb-2">今あなたが探求していること、頭から離れない問い</p>
                    <textarea id="question" placeholder="例：人はなぜ孤独を恐れるのか" rows="2"
                        class="eva-input w-full px-4 py-3 rounded-xl bg-white text-sm font-bold text-slate-900 placeholder-slate-400 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-purple-600 mb-1 leading-tight">Zone1：私のこだわり、これをとにかく語りたい！、超愛してる！</label>
                    <textarea id="zone1" placeholder="例：エヴァンゲリオン・人間関係に関する研究" rows="2"
                        class="eva-input w-full px-4 py-3 rounded-xl bg-slate-50 text-sm font-bold text-slate-900 placeholder-slate-400 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-teal-600 mb-1 leading-tight">Zone2：理屈抜きで大好き、推してる！どんな小さなことでも好きなこと</label>
                    <textarea id="zone2" placeholder="例：スポーツ観戦・寿司・現代芸術" rows="2"
                        class="eva-input w-full px-4 py-3 rounded-xl bg-slate-50 text-sm font-bold text-slate-900 placeholder-slate-400 resize-none"></textarea>
                </div>

                <!-- Zone3：会話スタイル（スライダー） -->
                <div>
                    <label class="block text-xs font-bold text-rose-500 mb-1 leading-tight">Zone3：あなたの会話スタイル</label>
                    <p class="text-[10px] text-slate-400 mb-4">直感でスライダーを動かしてみて</p>
                    <div class="space-y-5">

                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-2">
                                <span>⏳ じっくり深掘り</span>
                                <span>テンポよく広く ⚡</span>
                            </div>
                            <input type="range" id="s1" min="0" max="100" value="50">
                        </div>

                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-2">
                                <span>🗣 今日は話したい</span>
                                <span>今日は聞きたい 👂</span>
                            </div>
                            <input type="range" id="s2" min="0" max="100" value="50">
                        </div>

                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-2">
                                <span>🎯 具体・エピソード派</span>
                                <span>概念・抽象論派 🌀</span>
                            </div>
                            <input type="range" id="s3" min="0" max="100" value="50">
                        </div>

                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-2">
                                <span>😄 まず笑いから</span>
                                <span>すぐ深いとこへ 🔥</span>
                            </div>
                            <input type="range" id="s4" min="0" max="100" value="50">
                        </div>

                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-2">
                                <span>🤡 ボケ</span>
                                <span>ツッコミ 👊</span>
                            </div>
                            <input type="range" id="s5" min="0" max="100" value="50">
                        </div>

                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-500 mb-1 leading-tight">Zone4：人に聞いてみたいこと、実はよく知らないけど気になること</label>
                    <textarea id="zone4" placeholder="例：寂しさの根源・プログラミング・リール動画の作り方・友だちとの会話の仕方" rows="2"
                        class="eva-input w-full px-4 py-3 rounded-xl bg-slate-50 text-sm font-bold text-slate-900 placeholder-slate-400 resize-none"></textarea>
                </div>

            </div>

            <button onclick="generateQR()" class="sync-btn w-full mt-8 py-4 rounded-xl text-white font-black tracking-widest uppercase text-sm shadow-lg">
                Synchronization Start
            </button>

        </div>
    </div>

<script>
    window.onload = function() {
        const savedDataStr = localStorage.getItem('myHabitus');
        if (savedDataStr) {
            try {
                const d = JSON.parse(savedDataStr);
                if (d.name) document.getElementById('userName').value = d.name;
                if (d.q)    document.getElementById('question').value = d.q;
                if (d.z1)   document.getElementById('zone1').value = d.z1;
                if (d.z2)   document.getElementById('zone2').value = d.z2;
                if (d.z4)   document.getElementById('zone4').value = d.z4;
                if (d.s1 != null) document.getElementById('s1').value = d.s1;
                if (d.s2 != null) document.getElementById('s2').value = d.s2;
                if (d.s3 != null) document.getElementById('s3').value = d.s3;
                if (d.s4 != null) document.getElementById('s4').value = d.s4;
                if (d.s5 != null) document.getElementById('s5').value = d.s5;
            } catch(e) {
                console.error("データの復元に失敗しました", e);
            }
        }
    };

    function generateQR() {
        const name = document.getElementById('userName').value.trim();
        const q    = document.getElementById('question').value.trim();
        const z1   = document.getElementById('zone1').value.trim();
        const z2   = document.getElementById('zone2').value.trim();
        const z4   = document.getElementById('zone4').value.trim();
        const s1   = document.getElementById('s1').value;
        const s2   = document.getElementById('s2').value;
        const s3   = document.getElementById('s3').value;
        const s4   = document.getElementById('s4').value;
        const s5   = document.getElementById('s5').value;

        if (!name || !q || !z1 || !z2 || !z4) {
            alert("システムエラー：名前・問い・Zone1・Zone2・Zone4を入力してシンクロ率を上げてください。");
            return;
        }

        const myData = { name, q, z1, z2, z4, s1, s2, s3, s4, s5 };
        localStorage.setItem('myHabitus', JSON.stringify(myData));

        let currentUrl = window.location.href.split('?')[0];
        let baseUrl = currentUrl.replace('index.html', '').replace(/\/$/, '') + '/match.html';
        const matchUrl = `${baseUrl}?n=${encodeURIComponent(name)}&q=${encodeURIComponent(q)}&z1=${encodeURIComponent(z1)}&z2=${encodeURIComponent(z2)}&z4=${encodeURIComponent(z4)}&s1=${s1}&s2=${s2}&s3=${s3}&s4=${s4}&s5=${s5}`;

        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: matchUrl,
            width: 220,
            height: 220,
            colorDark: "#1e293b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.L
        });

        const qrWrapper = document.getElementById("qr-wrapper");
        qrWrapper.style.display = "flex";
        qrWrapper.animate([
            { opacity: 0, transform: 'translateY(-20px)' },
            { opacity: 1, transform: 'translateY(0)' }
        ], { duration: 500, fill: 'forwards', easing: 'ease-out' });

        window.scrollTo({ top: 0, behavior: 'smooth' });

        const btn = document.querySelector('.sync-btn');
        btn.textContent = "QR GENERATED (UPDATE)";
        btn.style.background = "#10b981";
    }
</script>

</body>
</html>
